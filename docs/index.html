<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo App</title>
  <style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f5f1e8;min-height:100vh;display:grid;place-items:center;padding:20px}.container{background:#fff;width:min(430px,100%);padding:28px;border-radius:12px;box-shadow:0 10px 25px #0002}h1,h2,p{text-align:center}h1{margin-top:0;color:#3f4536}form{display:flex;gap:10px;margin:18px 0}input{flex:1;padding:10px;border:1px solid #ccc;border-radius:6px}button{padding:10px 14px;border:0;border-radius:6px;background:#6b705c;color:#fff;cursor:pointer}button:hover{background:#5a5f4b}ul{list-style:none;padding:0}li{background:#f0ebe1;padding:10px;border-radius:6px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}.delete{background:#b56576}.note{font-size:12px;color:#777;margin-top:18px}</style>
</head>
<body><main class="container"><h1>Good day!</h1><h3>Add a Task!</h3><form id="form"><input id="task" required placeholder="Enter a task"><button>Add Task</button></form><h2>Remaining Tasks</h2><ul id="list"></ul><p class="note">Tasks are stored privately in this browser.</p></main>
<script>const key='mini-todo-demo-v1',tasks=JSON.parse(localStorage.getItem(key)||'[]'),list=document.querySelector('#list');function render(){list.innerHTML=tasks.length?tasks.map((t,i)=>'<li><span>'+t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span><button class="delete" data-i="'+i+'">Delete</button></li>').join(''):'<li>No tasks yet — add your first one.</li>';document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{tasks.splice(b.dataset.i,1);localStorage.setItem(key,JSON.stringify(tasks));render()})}form.onsubmit=e=>{e.preventDefault();tasks.push(task.value.trim());task.value='';localStorage.setItem(key,JSON.stringify(tasks));render()};render()</script></body>
</html>
