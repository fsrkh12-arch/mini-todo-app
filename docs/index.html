<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo App</title>
  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f5f1e8;min-height:100vh;display:grid;place-items:center;padding:20px}.container{background:#fff;width:min(430px,100%);padding:28px;border-radius:12px;box-shadow:0 10px 25px #0002}h1,h2,h3,p{text-align:center}h1{margin:0;color:#3f4536}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.top h1{font-size:26px}.auth-buttons{display:flex;gap:7px}.auth-buttons button{padding:8px 10px}.secondary{background:#8b907d}.secondary:hover{background:#747969}form{display:flex;gap:10px;margin:18px 0}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}#taskForm input{flex:1}button{padding:10px 14px;border:0;border-radius:6px;background:#6b705c;color:#fff;cursor:pointer}button:hover{background:#5a5f4b}ul{list-style:none;padding:0}li{background:#f0ebe1;padding:10px;border-radius:6px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}.done{text-decoration:line-through;opacity:.6}.delete,.clear{background:#9d4e5f}.clear{width:100%;margin-top:8px}.note{font-size:12px;color:#777;margin-top:18px}.hidden{display:none!important}.message{min-height:20px;color:#9d4e5f;font-size:13px;text-align:center}.auth-form{display:block;margin:10px 0}.auth-form input{margin:6px 0}.auth-form button{width:100%;margin-top:6px}
  </style>
</head>
<body>
  <main class="container">
    <section id="welcome">
      <h1>Todo App</h1><p>Keep your tasks in one simple place.</p>
      <div class="auth-buttons"><button id="showLogin">Login</button><button id="showRegister" class="secondary">Create account</button></div>
      <form id="loginForm" class="auth-form hidden"><input id="loginName" required minlength="3" maxlength="40" placeholder="Username" autocomplete="username"><input id="loginPassword" type="password" required minlength="8" placeholder="Password" autocomplete="current-password"><button>Login</button></form>
      <form id="registerForm" class="auth-form hidden"><input id="registerName" required minlength="3" maxlength="40" placeholder="Choose a username" autocomplete="username"><input id="registerPassword" type="password" required minlength="8" placeholder="Choose a password (8+ characters)" autocomplete="new-password"><input id="registerConfirm" type="password" required minlength="8" placeholder="Confirm password" autocomplete="new-password"><button>Create account</button></form>
      <p id="message" class="message"></p>
    </section>
    <section id="app" class="hidden">
      <div class="top"><h1>Good day!</h1><button id="logout" class="secondary">Logout</button></div>
      <h3>Add a Task!</h3><form id="taskForm"><input id="task" required maxlength="200" placeholder="Enter a task"><button>Add Task</button></form>
      <h2>Remaining Tasks</h2><ul id="list"></ul><button id="clear" class="clear">Clear Completed</button><p class="note">This GitHub Pages demo saves an account and tasks only in this browser.</p>
    </section>
  </main>
  <script>
    const usersKey='mini-todo-users-v1',sessionKey='mini-todo-session-v1';
    const welcome=document.querySelector('#welcome'),app=document.querySelector('#app'),message=document.querySelector('#message'),list=document.querySelector('#list');let currentUser=localStorage.getItem(sessionKey),tasks=[];
    const getUsers=()=>JSON.parse(localStorage.getItem(usersKey)||'{}');const safe=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    async function passwordHash(password){const data=new TextEncoder().encode(password),hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,'0')).join('')}
    function saveTasks(){localStorage.setItem('mini-todo-tasks-'+currentUser,JSON.stringify(tasks))}
    function render(){list.innerHTML=tasks.length?tasks.map((t,i)=>'<li><label class="'+(t.done?'done':'')+'"><input class="toggle" data-i="'+i+'" type="checkbox" '+(t.done?'checked':'')+'> '+safe(t.text)+'</label><button class="delete" data-i="'+i+'">Delete</button></li>').join(''):'<li>No tasks yet — add your first one.</li>';document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{tasks.splice(b.dataset.i,1);saveTasks();render()});document.querySelectorAll('.toggle').forEach(b=>b.onchange=()=>{tasks[b.dataset.i].done=b.checked;saveTasks();render()})}
    function openApp(){currentUser=localStorage.getItem(sessionKey);tasks=JSON.parse(localStorage.getItem('mini-todo-tasks-'+currentUser)||'[]');welcome.classList.add('hidden');app.classList.remove('hidden');render()}
    function openForm(name){message.textContent='';loginForm.classList.toggle('hidden',name!=='login');registerForm.classList.toggle('hidden',name!=='register')}
    showLogin.onclick=()=>openForm('login');showRegister.onclick=()=>openForm('register');
    registerForm.onsubmit=async e=>{e.preventDefault();const name=registerName.value.trim(),users=getUsers();if(registerPassword.value!==registerConfirm.value){message.textContent='Passwords do not match.';return}if(users[name]){message.textContent='That username is already taken.';return}users[name]=await passwordHash(registerPassword.value);localStorage.setItem(usersKey,JSON.stringify(users));localStorage.setItem(sessionKey,name);openApp()};
    loginForm.onsubmit=async e=>{e.preventDefault();const name=loginName.value.trim(),users=getUsers();if(!users[name]||users[name]!==await passwordHash(loginPassword.value)){message.textContent='Incorrect username or password.';return}localStorage.setItem(sessionKey,name);openApp()};
    taskForm.onsubmit=e=>{e.preventDefault();const text=task.value.trim();if(!text)return;tasks.push({text,done:false});task.value='';saveTasks();render()};clear.onclick=()=>{tasks=tasks.filter(t=>!t.done);saveTasks();render()};logout.onclick=()=>{localStorage.removeItem(sessionKey);currentUser=null;app.classList.add('hidden');welcome.classList.remove('hidden');openForm('none')};if(currentUser)openApp();
  </script>
</body>
</html>
