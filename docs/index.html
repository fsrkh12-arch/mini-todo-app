<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo App</title>
  <style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f5f1e8;min-height:100vh;display:grid;place-items:center;padding:20px}.container{background:#fff;width:min(430px,100%);padding:28px;border-radius:12px;box-shadow:0 10px 25px #0002}h1,h2,p{text-align:center}h1{margin-top:0;color:#3f4536}form{display:flex;gap:10px;margin:18px 0}input{flex:1;padding:10px;border:1px solid #ccc;border-radius:6px}button{padding:10px 14px;border:0;border-radius:6px;background:#6b705c;color:#fff;cursor:pointer}button:hover{background:#5a5f4b}ul{list-style:none;padding:0}li{background:#f0ebe1;padding:10px;border-radius:6px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}.done{text-decoration:line-through;opacity:.6}.delete{background:#b56576}.clear{background:#9d4e5f;width:100%;margin-top:8px}.note{font-size:12px;color:#777;margin-top:18px}</style>
</head>
<body><main class="container"><h1>Good day!</h1><h3>Add a Task!</h3><form id="form"><input id="task" required maxlength="200" placeholder="Enter a task"><button>Add Task</button></form><h2>Remaining Tasks</h2><ul id="list"></ul><button id="clear" class="clear">Clear Completed</button><p class="note">Tasks are stored privately in this browser.</p></main>
<script>const key='mini-todo-demo-v2',tasks=JSON.parse(localStorage.getItem(key)||'[]'),list=document.querySelector('#list'),safe=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(tasks))}function render(){list.innerHTML=tasks.length?tasks.map((t,i)=>'<li><label class="'+(t.done?'done':'')+'"><input class="toggle" data-i="'+i+'" type="checkbox" '+(t.done?'checked':'')+'> '+safe(t.text)+'</label><button class="delete" data-i="'+i+'">Delete</button></li>').join(''):'<li>No tasks yet — add your first one.</li>';document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{tasks.splice(b.dataset.i,1);save();render()});document.querySelectorAll('.toggle').forEach(b=>b.onchange=()=>{tasks[b.dataset.i].done=b.checked;save();render()})}form.onsubmit=e=>{e.preventDefault();tasks.push({text:task.value.trim(),done:false});task.value='';save();render()};clear.onclick=()=>{for(let i=tasks.length-1;i>=0;i--)if(tasks[i].done)tasks.splice(i,1);save();render()};render()</script></body>
</html>
